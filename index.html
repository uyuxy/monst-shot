<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>モンスト ショット固定ツール</title>
<style>
:root{--bg:#f6f6f4;--fg:#1d1d1b;--card:#fff;--bd:#d8d8d2;--ac:#2a6df4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161616;--fg:#eee;--card:#222;--bd:#3a3a3a;--ac:#6b9bff}}
:root[data-theme="dark"]{--bg:#161616;--fg:#eee;--card:#222;--bd:#3a3a3a;--ac:#6b9bff}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,"Hiragino Sans",sans-serif}
.wrap{max-width:720px;margin:auto;display:grid;gap:8px;padding:0 4px 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px}
#vp{display:none;margin:0 auto;overflow:hidden;width:fit-content;max-width:100%;touch-action:none;border-radius:6px}
canvas{display:block;max-width:100%;max-height:calc(100svh - 120px);width:auto;height:auto;transform-origin:0 0}
label{display:inline-block;margin:2px 8px 2px 0;font-size:13px}
input[type=number]{width:64px}
input[type=range]{width:120px;vertical-align:middle}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 12px;margin:3px 3px 3px 0;font-size:14px;min-height:40px}
button.s{background:transparent;color:var(--fg);border:1px solid var(--bd)}
.pad{display:inline-grid;grid-template-columns:repeat(3,44px);gap:3px;vertical-align:middle}
.pad button{margin:0;padding:0}
.small{font-size:12px;opacity:.75}
.scroll{overflow-x:auto}
table{border-collapse:collapse;font-size:12px;white-space:nowrap}
td,th{border-bottom:1px solid var(--bd);padding:3px 6px;text-align:left}
</style></head><body>
<div class="wrap">
<div class="card"><input type="file" id="file" accept="image/*"> <span id="info" class="small">スクショを読み込んでください</span></div>
<div id="vp"><canvas id="cv" width="360" height="640"></canvas></div>

<div class="card">
<button data-m="start">スタート位置</button><button data-m="pull" class="s">角度（引っ張り）</button><button data-m="move" class="s">移動</button>
<button class="s" id="zi">＋</button><button class="s" id="zo">－</button><button class="s" id="zr">戻す</button><br>
<b class="small">位置の微調整</b>
<span class="pad"><span></span><button data-n="0,-1">↑</button><span></span><button data-n="-1,0">←</button><span></span><button data-n="1,0">→</button><span></span><button data-n="0,1">↓</button><span></span></span>
<label>幅 <select id="nst"><option value="0.1">細かい</option><option value="0.4" selected>普通</option></select></label><br>
<b class="small">角度の微調整</b>
<button class="s" data-a="-1">左へ1°</button><button class="s" data-a="-0.1">左へ0.1°</button><button class="s" data-a="0.1">右へ0.1°</button><button class="s" data-a="1">右へ1°</button>
</div>

<div class="card">
<label>名前 <input type="text" id="nm" value="ショット1" style="width:110px"></label>
<label>引き方 <select id="mode"><option value="0.5">ゲージ有</option><option value="0.01">即打ち</option></select></label>
<label>引っ張る長さ <input type="number" id="len" value="100" min="20" max="300"></label>
<label>ファイル名 <input type="text" id="fn" value="monst-shots" style="width:120px"></label><br>
<button id="add">ファイルを作成</button><button id="dv">ファイルを保存</button>
<div class="scroll"><table id="tb"></table></div>
</div>

<div class="card"><button id="opb" class="s">オプション（壁の調整）</button>
<div id="opt" style="display:none;margin-top:8px"><span class="small">反射する壁の位置（%）を画像に合わせて調整</span><br>
<label>左 <input type="range" id="bl" min="0" max="50" step="0.1" value="3.3"></label>
<label>右 <input type="range" id="br" min="50" max="100" step="0.1" value="96.3"></label>
<label>上 <input type="range" id="bt" min="0" max="60" step="0.1" value="21"></label>
<label>下 <input type="range" id="bb" min="30" max="100" step="0.1" value="68.2"></label><br>
<label>反射回数 <input type="number" id="bn" value="6" min="1" max="20"></label>
<label>キャラの大きさ(%) <input type="number" id="rad" value="4.4" min="1" max="12" step="0.1"></label>
</div></div>
</div>
<script>
const $=id=>document.getElementById(id);
const SW=390;
const cv=$('cv'),c=cv.getContext('2d'),vp=$('vp');
let img=null,mode='start',start=null,dir=null,shots=[],V={z:1,x:0,y:0};
try{const t=localStorage.getItem('monstShots');if(t)shots=JSON.parse(t)}catch(e){}
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{const i=new Image();i.onload=()=>{img=i;cv.width=i.width;cv.height=i.height;start=null;dir=null;V={z:1,x:0,y:0};vp.style.display='block';applyV();draw()};i.src=r.result};r.readAsDataURL(f)};
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('[data-m]').forEach(x=>x.className=x===b?'':'s')});
function applyV(){const w=cv.offsetWidth,h=cv.offsetHeight;V.z=Math.min(8,Math.max(1,V.z));V.x=Math.min(0,Math.max(w-w*V.z,V.x));V.y=Math.min(0,Math.max(h-h*V.z,V.y));cv.style.transform=`translate(${V.x}px,${V.y}px) scale(${V.z})`}
function zoomAt(px,py,nz){nz=Math.min(8,Math.max(1,nz));const ix=(px-V.x)/V.z,iy=(py-V.y)/V.z;V.z=nz;V.x=px-ix*nz;V.y=py-iy*nz;applyV()}
$('zi').onclick=()=>zoomAt(vp.clientWidth/2,vp.clientHeight/2,V.z*1.5);
$('zo').onclick=()=>zoomAt(vp.clientWidth/2,vp.clientHeight/2,V.z/1.5);
$('zr').onclick=()=>{V={z:1,x:0,y:0};applyV()};
window.addEventListener('resize',applyV);
const P=new Map();let pin=null,lastP=null,noAct=false;
const vpt=e=>{const r=vp.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
function act(e){if(!img)return;const r=cv.getBoundingClientRect();const p={x:(e.clientX-r.left)/r.width*cv.width,y:(e.clientY-r.top)/r.height*cv.height};
 if(mode==='start')start=p;else if(mode==='pull'&&start){const dx=start.x-p.x,dy=start.y-p.y,L=Math.hypot(dx,dy);if(L>3)dir={x:dx/L,y:dy/L}}
 draw()}
vp.onpointerdown=e=>{vp.setPointerCapture(e.pointerId);P.set(e.pointerId,vpt(e));
 if(P.size===2){const[a,b]=[...P.values()];pin={d:Math.hypot(a.x-b.x,a.y-b.y),z:V.z,x:V.x,y:V.y,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2};noAct=true;return}
 if(P.size===1){noAct=false;lastP=vpt(e);if(mode!=='move')act(e)}};
vp.onpointermove=e=>{if(!P.has(e.pointerId))return;const p=vpt(e);P.set(e.pointerId,p);
 if(P.size>=2&&pin){const[a,b]=[...P.values()];const d=Math.hypot(a.x-b.x,a.y-b.y),cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;
  const nz=Math.min(8,Math.max(1,pin.z*d/pin.d)),ix=(pin.cx-pin.x)/pin.z,iy=(pin.cy-pin.y)/pin.z;V.z=nz;V.x=cx-ix*nz;V.y=cy-iy*nz;applyV();return}
 if(P.size===1){if(mode==='move'){V.x+=p.x-lastP.x;V.y+=p.y-lastP.y;applyV()}else if(!noAct)act(e);lastP=p}};
const up=e=>{P.delete(e.pointerId);if(P.size<2)pin=null;if(P.size===1)lastP=[...P.values()][0]};
vp.onpointerup=up;vp.onpointercancel=up;
vp.onwheel=e=>{e.preventDefault();const p=vpt(e);zoomAt(p.x,p.y,V.z*(e.deltaY<0?1.2:1/1.2))};
document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{if(!start)return;const[a,d]=b.dataset.n.split(',').map(Number),s=cv.width*$('nst').value/100;start.x+=a*s;start.y+=d*s;draw()});
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{if(!start)return;const t=+b.dataset.a*Math.PI/180,cs=Math.cos(t),sn=Math.sin(t);if(!dir)dir={x:0,y:-1};dir={x:dir.x*cs-dir.y*sn,y:dir.x*sn+dir.y*cs};draw()});
['bl','br','bt','bb','bn','rad'].forEach(i=>$(i).oninput=draw);
$('opb').onclick=()=>{const o=$('opt');o.style.display=o.style.display==='none'?'block':'none';draw()};
function walls(){const W=cv.width,H=cv.height;return{l:W*$('bl').value/100,r:W*$('br').value/100,t:H*$('bt').value/100,b:H*$('bb').value/100}}
function sim(){
 if(!start||!dir)return null;const w=walls(),R=cv.width*$('rad').value/100,N=+$('bn').value;
 let x=start.x,y=start.y,dx=dir.x,dy=dir.y;const pts=[{x,y}],ds=[[dx,dy]];
 for(let n=0;n<=N;n++){let tx=1e9,ty=1e9;
  if(dx>0)tx=(w.r-R-x)/dx;else if(dx<0)tx=(w.l+R-x)/dx;
  if(dy>0)ty=(w.b-R-y)/dy;else if(dy<0)ty=(w.t+R-y)/dy;
  const t=Math.max(0,Math.min(tx,ty));x+=dx*t;y+=dy*t;pts.push({x,y});
  if(n===N)break;if(tx<=ty)dx=-dx;else dy=-dy;ds.push([dx,dy])}
 return{pts,ds}}
const ang=d=>Math.round(((Math.atan2(-d[1],d[0])*180/Math.PI+360)%360)*10)/10;
function draw(){
 const W=cv.width,k=W/400;
 c.clearRect(0,0,W,cv.height);
 if(img)c.drawImage(img,0,0);else{c.fillStyle='#777';c.fillRect(0,0,W,cv.height)}
 if($('opt').style.display!=='none'){const w=walls();c.strokeStyle='rgba(255,200,0,.9)';c.lineWidth=2*k;c.setLineDash([8*k,6*k]);c.strokeRect(w.l,w.t,w.r-w.l,w.b-w.t);c.setLineDash([])}
 const R=W*$('rad').value/100;
 if(start&&dir){const L=+$('len').value/SW*W;c.strokeStyle='rgba(255,80,80,.85)';c.lineWidth=2*k;c.beginPath();c.moveTo(start.x,start.y);c.lineTo(start.x-dir.x*L,start.y-dir.y*L);c.stroke()}
 const s=sim();
 if(s){c.lineWidth=3*k;c.font=(13*k)+'px sans-serif';
  s.pts.forEach((p,i)=>{if(i===0)return;const q=s.pts[i-1];
   c.strokeStyle=`hsl(${(i*55)%360},90%,55%)`;c.beginPath();c.moveTo(q.x,q.y);c.lineTo(p.x,p.y);c.stroke();
   if(i<=2){const t=ang(s.ds[i-1])+'°',mx=(p.x+q.x)/2,my=(p.y+q.y)/2,tw=c.measureText(t).width;
    c.fillStyle='rgba(0,0,0,.75)';c.fillRect(mx-4*k,my-14*k,tw+8*k,18*k);c.fillStyle='#fff';c.fillText(t,mx,my)}});
  $('info').textContent='発射 '+ang(s.ds[0])+'°'+(s.ds[1]?' / 1反射後 '+ang(s.ds[1])+'°':'')+' / 反射 '+(s.pts.length-2)+'回'}
 if(start){c.fillStyle='rgba(0,200,255,.35)';c.beginPath();c.arc(start.x,start.y,R,0,7);c.fill();c.strokeStyle='#fff';c.lineWidth=2*k;c.stroke();
  c.beginPath();c.moveTo(start.x-4*k,start.y);c.lineTo(start.x+4*k,start.y);c.moveTo(start.x,start.y-4*k);c.lineTo(start.x,start.y+4*k);c.stroke()}}
function gesture(){
 if(!start||!dir)return null;
 const sh=SW*cv.height/cv.width,len=+$('len').value,cx=SW/2,cy=sh/2,M=20;
 let vx=-dir.x*len,vy=-dir.y*len,k=1;const hx=Math.abs(vx)/2,hy=Math.abs(vy)/2;
 if(hx>0)k=Math.min(k,(Math.min(cx,SW-cx)-M)/hx);if(hy>0)k=Math.min(k,(Math.min(cy,sh-cy)-M)/hy);
 vx*=k;vy*=k;const r=n=>Math.round(n*10)/10,s=sim();
 return{name:$('nm').value,seconds:+$('mode').value,angle:ang([dir.x,dir.y]),start:{x:r(cx-vx/2),y:r(cy-vy/2)},end:{x:r(cx+vx/2),y:r(cy+vy/2)},bounces:s?s.pts.length-2:0}}
$('add').onclick=()=>{const g=gesture();if(!g)return alert('スタート位置を決めて、角度（引っ張り）を設定してください');
 if(shots.some(s=>s.name===g.name))return alert('「'+g.name+'」は同じ名前のショットが既にあります。同じ名前だと最初の1つしか実行されないので、別の名前にしてください');
 shots.push(g);const n=g.name.replace(/(\d+)(?!.*\d)/,m=>+m+1);$('nm').value=n===g.name?g.name+'2':n;save();render()};
function save(){try{localStorage.setItem('monstShots',JSON.stringify(shots))}catch(e){}}
function render(){$('tb').innerHTML='<tr><th>名前</th><th>始点</th><th>終点</th><th>引き方</th><th>角度</th><th></th></tr>'+
 shots.map((g,i)=>`<tr><td><input value="${esc(g.name)}" style="width:90px" onchange="shots[${i}].name=this.value;save()"></td><td>${g.start.x},${g.start.y}</td><td>${g.end.x},${g.end.y}</td><td>${g.seconds>=0.1?'ゲージ有':'即打ち'}</td><td>${g.angle}°</td><td><button class="s" onclick="shots.splice(${i},1);save();render()">削除</button></td></tr>`).join('')}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function fname(){return ($('fn').value||'monst-shots').replace(/[\\\/:*?"<>|\s]+/g,'_')}
async function dlf(name,txt){
 if(!window.claude){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt]));a.download=name;document.body.appendChild(a);a.click();a.remove();return}
 if(name.endsWith('.voicecontrolcommands'))name+='.txt';
 try{const d=await claude.use('downloads');if(!d)return alert('このビューでは保存できません');await d.save({filename:name,data:txt})}catch(e){if(!e||e.code!=='declined')alert('保存できませんでした: '+((e&&(e.code||e.message))||e))}}
class UID{constructor(n){this.n=n}}class Real{constructor(v){this.v=v}}
function bplist(root){
 const objs=[],memo=new Map();
 const pk=o=>o instanceof UID?'u'+o.n:o instanceof Real?'r'+o.v:typeof o+':'+o;
 function add(o){
  const prim=!(o instanceof Array)&&(o instanceof UID||o instanceof Real||typeof o!=='object');
  if(prim){const k=pk(o);if(memo.has(k))return memo.get(k)}
  const i=objs.length;objs.push(null);
  if(prim){memo.set(pk(o),i);objs[i]={t:'v',v:o}}
  else if(o instanceof Array){const r=o.map(add);objs[i]={t:'a',r}}
  else{const ks=Object.keys(o);const kr=ks.map(k=>add(k));const vr=ks.map(k=>add(o[k]));objs[i]={t:'d',k:kr,v:vr}}
  return i}
 add(root);
 const rs=objs.length<256?1:2;
 const out=[];const push=b=>{for(const x of b)out.push(x)};
 push([...'bplist00'].map(c=>c.charCodeAt(0)));
 const offs=[];
 const intb=n=>n<256?[0x10,n]:n<65536?[0x11,n>>8,n&255]:[0x12,(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255];
 const len=(m,n)=>{if(n<15)push([m|n]);else{push([m|15]);push(intb(n))}};
 const ref=r=>{if(rs===1)push([r]);else push([r>>8,r&255])};
 objs.forEach(o=>{offs.push(out.length);
  if(o.t==='a'){len(0xA0,o.r.length);o.r.forEach(ref)}
  else if(o.t==='d'){len(0xD0,o.k.length);o.k.forEach(ref);o.v.forEach(ref)}
  else{const v=o.v;
   if(v===true)push([9]);else if(v===false)push([8]);
   else if(typeof v==='number')push(intb(v));
   else if(v instanceof Real){const b=new Uint8Array(8);new DataView(b.buffer).setFloat64(0,v.v);push([0x23]);push(b)}
   else if(v instanceof UID){if(v.n<256)push([0x80,v.n]);else push([0x81,v.n>>8,v.n&255])}
   else{len(0x50,v.length);for(const c of v)push([c.charCodeAt(0)])}}});
 const ot=out.length,os=ot<65536?2:4;
 offs.forEach(f=>{if(os===2)push([f>>8,f&255]);else push([f>>>24,(f>>>16)&255,(f>>>8)&255,f&255])});
 const w8=n=>push([0,0,0,0,(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255]);
 push([0,0,0,0,0,0,os,rs]);w8(objs.length);w8(0);w8(ot);
 return Uint8Array.from(out)}
function gestureArchive(pts){
 const O=[];const add=o=>{O.push(o);return new UID(O.length-1)};
 add('$null');
 const root={};const ri=add(root);
 const cl=(n,c)=>add({$classname:n,$classes:c});
 const cVal=cl('NSValue',['NSValue','NSObject']);
 const cMD=cl('NSMutableDictionary',['NSMutableDictionary','NSDictionary','NSObject']);
 const cD=cl('NSDictionary',['NSDictionary','NSObject']);
 const cArr=cl('NSMutableArray',['NSMutableArray','NSArray','NSObject']);
 const cGes=cl('AXMutableReplayableGesture',['AXMutableReplayableGesture','AXReplayableGesture','NSObject']);
 const kF=add('Fingers'),kT=add('Time'),kFo=add('Forces'),one=add(1),zero=add(new Real(0));
 const B=810000000;
 const evs=pts.map(p=>{
  const val=add({'NS.pointval':add('{'+p.x+', '+p.y+'}'),$class:cVal,'NS.special':1});
  const fin=add({'NS.keys':[one],'NS.objects':[val],$class:cMD});
  const frc=add({'NS.keys':[one],'NS.objects':[zero],$class:cMD});
  return add({'NS.keys':[kF,kT,kFo],'NS.objects':[fin,add(new Real(B+p.t)),frc],$class:cD})});
 const last=pts[pts.length-1];
 const ef=add({'NS.keys':[],'NS.objects':[],$class:cMD}),eg=add({'NS.keys':[],'NS.objects':[],$class:cMD});
 evs.push(add({'NS.keys':[kF,kT,kFo],'NS.objects':[ef,add(new Real(B+last.t+0.0001)),eg],$class:cD}));
 const all=add({'NS.objects':evs,$class:cArr});
 Object.assign(root,{$class:cGes,AllEvents:all,Version:add(1),ArePointsDeviceRelative:false});
 return bplist({$archiver:'NSKeyedArchiver',$objects:O,$top:{root:ri},$version:100000})}
function makeGesture(s){ // s:{start,end,seconds}
 const n=Math.max(2,Math.round(s.seconds*60)+1),pts=[];
 for(let i=0;i<n;i++){const u=i/(n-1),e=u*u*(3-2*u),q=n===2?u:e;
  pts.push({x:+(s.start.x+(s.end.x-s.start.x)*q).toFixed(3),y:+(s.start.y+(s.end.y-s.start.y)*q).toFixed(3),t:+(s.seconds*u).toFixed(5)})}
 return gestureArchive(pts)}
function b64(u){let s='';for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s).replace(/(.{52})/g,'$1\n\t\t\t')}
function xmlEsc(s){return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
function makeVCC(shots){
 const now=new Date().toISOString().replace(/\.\d+Z$/,'Z');
 let x='<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n\t<key>CommandsTable</key>\n\t<dict>\n';
 shots.forEach((g,i)=>{const id='Custom.'+(700000000+Math.floor(Math.random()*99999999))+'.'+(100000+Math.floor(Math.random()*899999)+i);
