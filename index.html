<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>モンスト ショット固定ツール</title>
<style>
:root{--bg:#f6f6f4;--fg:#1d1d1b;--card:#fff;--bd:#d8d8d2;--ac:#2a6df4}

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}

.wrap{max-width:720px;margin:auto;display:grid;gap:8px;padding:0 4px 12px}

label{display:inline-block;margin:2px 8px 2px 0;font-size:13px}
input[type=number]{width:64px}
input[type=range]{width:120px;vertical-align:middle}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 12px;margin:3px 3px 3px 0;font-size:14px;min-height:40px}

.pad button{margin:0;padding:0;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.small{font-size:12px;opacity:.75}
.sc{border:1px solid var(--bd);border-radius:8px;padding:6px;margin:4px 0;background:var(--card)}
.sc.dg{outline:2px solid var(--ac);opacity:.92}
.sc .r1{display:flex;gap:4px;align-items:center}
.sc .r1 input[data-f=name]{flex:1;min-width:0}
.sc button{min-height:34px;padding:4px 10px;margin:2px}
.sc:last-child .gp{display:none}
.hd{touch-action:none;cursor:grab;font-size:24px;line-height:1;padding:6px 8px;-webkit-user-select:none;user-select:none}
.scroll{overflow-x:auto}
table{border-collapse:collapse;font-size:12px;white-space:nowrap}
td,th{border-bottom:1px solid var(--bd);padding:3px 6px;text-align:left}
</style></head><body>
<div class="wrap">
<div id="sh" style="display:grid;gap:8px">

</div>
<div id="m1" style="display:grid;gap:8px">
<div class="card">

</div>

</div>
<div id="m2" style="display:none;gap:8px">

<input type="file" id="f2"> <span id="info2" class="small"></span></div>

</div>
<script>
const $=id=>document.getElementById(id);
const SW=390;
const cv=$('cv'),c=cv.getContext('2d'),vp=$('vp');
let img=null,mode='start',start=null,dir=null,shots=[],V={z:1,x:0,y:0};
try{const t=localStorage.getItem('monstShots');if(t)shots=JSON.parse(t).filter(s=>!s.chain)}catch(e){}
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{const i=new Image();i.onload=()=>{img=i;cv.width=i.width;cv.height=i.height;start=null;dir=null;V={z:1,x:0,y:0};vp.style.display='block';applyV();draw();det=null;if($('auto').checked)runDetect()};i.src=r.result};r.readAsDataURL(f)};
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('[data-m]').forEach(x=>x.className=x===b?'':'s')});
function applyV(){const w=cv.offsetWidth,h=cv.offsetHeight;V.z=Math.min(8,Math.max(1,V.z));V.x=Math.min(0,Math.max(w-w*V.z,V.x));V.y=Math.min(0,Math.max(h-h*V.z,V.y));cv.style.transform=`translate(${V.x}px,${V.y}px) scale(${V.z})`}
function zoomAt(px,py,nz){nz=Math.min(8,Math.max(1,nz));const ix=(px-V.x)/V.z,iy=(py-V.y)/V.z;V.z=nz;V.x=px-ix*nz;V.y=py-iy*nz;applyV()}
$('zi').onclick=()=>zoomAt(vp.clientWidth/2,vp.clientHeight/2,V.z*1.5);
$('zo').onclick=()=>zoomAt(vp.clientWidth/2,vp.clientHeight/2,V.z/1.5);
$('zr').onclick=()=>{V={z:1,x:0,y:0};applyV()};
window.addEventListener('resize',applyV);
const P=new Map();let pin=null,lastP=null,noAct=false;
const vpt=e=>{const r=vp.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
function act(e){if(!img)return;const r=cv.getBoundingClientRect();const p={x:(e.clientX-r.left)/r.width*cv.width,y:(e.clientY-r.top)/r.height*cv.height};
 if(mode==='start')start=p;else if(mode==='pull'&&start){const dx=start.x-p.x,dy=start.y-p.y,L=Math.hypot(dx,dy);if(L>3)setDir({x:dx/L,y:dy/L})}
 draw()}
vp.onpointerdown=e=>{vp.setPointerCapture(e.pointerId);P.set(e.pointerId,vpt(e));
 if(P.size===2){const[a,b]=[...P.values()];pin={d:Math.hypot(a.x-b.x,a.y-b.y),z:V.z,x:V.x,y:V.y,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2};noAct=true;return}
 if(P.size===1){noAct=false;lastP=vpt(e);if(mode!=='move')act(e)}};
vp.onpointermove=e=>{if(!P.has(e.pointerId))return;const p=vpt(e);P.set(e.pointerId,p);
 if(P.size>=2&&pin){const[a,b]=[...P.values()];const d=Math.hypot(a.x-b.x,a.y-b.y),cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;
  const nz=Math.min(8,Math.max(1,pin.z*d/pin.d)),ix=(pin.cx-pin.x)/pin.z,iy=(pin.cy-pin.y)/pin.z;V.z=nz;V.x=cx-ix*nz;V.y=cy-iy*nz;applyV();return}
 if(P.size===1){if(mode==='move'){V.x+=p.x-lastP.x;V.y+=p.y-lastP.y;applyV()}else if(!noAct)act(e);lastP=p}};
const up=e=>{P.delete(e.pointerId);if(P.size<2)pin=null;if(P.size===1)lastP=[...P.values()][0]};
vp.onpointerup=up;vp.onpointercancel=up;
vp.onwheel=e=>{e.preventDefault();const p=vpt(e);zoomAt(p.x,p.y,V.z*(e.deltaY<0?1.2:1/1.2))};
document.querySelectorAll('[data-n]').forEach(b=>{let t1=null,t2=null;
 const step=()=>{if(!start)return;const[a,d]=b.dataset.n.split(',').map(Number),s=cv.width*$('nst').value/100;start.x+=a*s;start.y+=d*s;draw()};
 const stop=()=>{clearTimeout(t1);clearInterval(t2);t1=t2=null};
 b.onpointerdown=e=>{e.preventDefault();stop();step();t1=setTimeout(()=>{t2=setInterval(step,70)},350)};
 b.onpointerup=b.onpointerleave=b.onpointercancel=stop;b.oncontextmenu=e=>e.preventDefault()});
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{if(tab===2){if(rows[sel]){rotRow(rows[sel],+b.dataset.a);renderR();draw()}return}if(!start)return;const t=+b.dataset.a*Math.PI/180,cs=Math.cos(t),sn=Math.sin(t);if(!dir)dir={x:0,y:-1};dir={x:dir.x*cs-dir.y*sn,y:dir.x*sn+dir.y*cs};draw()});
['bl','br','bt','bb','bn','rad'].forEach(i=>$(i).oninput=draw);
$('opb').onclick=()=>{const o=$('opt');o.style.display=o.style.display==='none'?'block':'none';draw()};
function walls(){const W=cv.width,H=cv.height;return{l:W*$('bl').value/100,r:W*$('br').value/100,t:H*$('bt').value/100,b:H*$('bb').value/100}}
function sim(){
 const D=curDir();if(!start||!D)return null;const w=walls(),N=+$('bn').value;
 let x=start.x,y=start.y,dx=D.x,dy=D.y;const pts=[{x,y}],ds=[[dx,dy]];
 for(let n=0;n<=N;n++){let tx=1e9,ty=1e9;
  if(dx>0)tx=(w.r-x)/dx;else if(dx<0)tx=(w.l-x)/dx;
  if(dy>0)ty=(w.b-y)/dy;else if(dy<0)ty=(w.t-y)/dy;
  const t=Math.max(0,Math.min(tx,ty));x+=dx*t;y+=dy*t;pts.push({x,y});
  if(n===N)break;if(tx<=ty)dx=-dx;else dy=-dy;ds.push([dx,dy])}
 return{pts,ds}}
const ang=d=>Math.round(((Math.atan2(-d[1],d[0])*180/Math.PI+360)%360)*10)/10;
function draw0(){
 const W=cv.width,k=W/400;
 c.clearRect(0,0,W,cv.height);
 if(img)c.drawImage(img,0,0);else{c.fillStyle='#777';c.fillRect(0,0,W,cv.height)}
 {const w=walls();c.strokeStyle='rgba(255,200,0,.9)';c.lineWidth=2*k;c.setLineDash([8*k,6*k]);c.strokeRect(w.l,w.t,w.r-w.l,w.b-w.t);c.setLineDash([])}
 const R=W*$('rad').value/100;
 const D=curDir();if(start&&D){const L=curLen()/SW*W;c.strokeStyle='rgba(255,80,80,.85)';c.lineWidth=2*k;c.beginPath();c.moveTo(start.x,start.y);c.lineTo(start.x-D.x*L,start.y-D.y*L);c.stroke()}
 const s=sim();
 if(s){c.lineWidth=3*k;c.font=(13*k)+'px sans-serif';
  s.pts.forEach((p,i)=>{if(i===0)return;const q=s.pts[i-1];
   c.strokeStyle=`hsl(${(i*55)%360},90%,55%)`;c.beginPath();c.moveTo(q.x,q.y);c.lineTo(p.x,p.y);c.stroke();
   if(i<=2){const t=ang(s.ds[i-1])+'°',mx=(p.x+q.x)/2,my=(p.y+q.y)/2,tw=c.measureText(t).width;
    c.fillStyle='rgba(0,0,0,.75)';c.fillRect(mx-4*k,my-14*k,tw+8*k,18*k);c.fillStyle='#fff';c.fillText(t,mx,my)}});
  $('info').textContent='発射 '+ang(s.ds[0])+'°'+(s.ds[1]?' / 1反射後 '+ang(s.ds[1])+'°':'')+' / 反射 '+(s.pts.length-2)+'回'}
 drawDet();if(start){c.fillStyle='rgba(0,200,255,.35)';c.beginPath();c.arc(start.x,start.y,R,0,7);c.fill();c.strokeStyle='#fff';c.lineWidth=2*k;c.stroke();
  c.beginPath();c.moveTo(start.x-4*k,start.y);c.lineTo(start.x+4*k,start.y);c.moveTo(start.x,start.y-4*k);c.lineTo(start.x,start.y+4*k);c.stroke()}}
function gesture(){
 if(!start||!dir)return null;
 const sh=SW*cv.height/cv.width,len=+$('len').value,cx=SW/2,cy=sh/2,M=20;
 let vx=-dir.x*len,vy=-dir.y*len,k=1;const hx=Math.abs(vx)/2,hy=Math.abs(vy)/2;
 if(hx>0)k=Math.min(k,(Math.min(cx,SW-cx)-M)/hx);if(hy>0)k=Math.min(k,(Math.min(cy,sh-cy)-M)/hy);
 vx*=k;vy*=k;const r=n=>Math.round(n*10)/10,s=sim();
 return{name:$('nm').value,seconds:+$('mode').value,angle:ang([dir.x,dir.y]),start:{x:r(cx-vx/2),y:r(cy-vy/2)},end:{x:r(cx+vx/2),y:r(cy+vy/2)},bounces:s?s.pts.length-2:0}}
$('add').onclick=()=>{const g=gesture();if(!g)return alert('スタート位置を決めて、角度（引っ張り）を設定してください');
 if(shots.some(s=>s.name===g.name))return alert('「'+g.name+'」は同じ名前のショットが既にあります。同じ名前だと最初の1つしか実行されないので、別の名前にしてください');
 shots.push(g);const n=g.name.replace(/(\d+)(?!.*\d)/,m=>+m+1);$('nm').value=n===g.name?g.name+'2':n;save();render()};
function save(){try{localStorage.setItem('monstShots',JSON.stringify(shots))}catch(e){}}
function render(){$('tb').innerHTML='<tr><th>名前</th><th>引き方</th><th>角度</th><th></th></tr>'+
 shots.map((g,i)=>`<tr><td><input value="${esc(g.name)}" style="width:90px" onchange="shots[${i}].name=this.value;save()"></td><td>${g.seconds>=0.1?'ゲージ有':'即打ち'}</td><td>${g.angle}°</td><td><button class="s" onclick="shots.splice(${i},1);save();render()">削除</button></td></tr>`).join('')}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function fname(){return ($('fn').value||'monst-shots').replace(/[\\\/:*?"<>|\s]+/g,'_')}
async function dlf(name,txt){
 if(!window.claude){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt]));a.download=name;document.body.appendChild(a);a.click();a.remove();return}
 if(name.endsWith('.voicecontrolcommands'))name+='.txt';
 try{const d=await claude.use('downloads');if(!d)return alert('このビューでは保存できません');await d.save({filename:name,data:txt})}catch(e){if(!e||e.code!=='declined')alert('保存できませんでした: '+((e&&(e.code||e.message))||e))}}
class UID{constructor(n){this.n=n}}class Real{constructor(v){this.v=v}}
function bplist(root){
 const objs=[],memo=new Map();
 const pk=o=>o instanceof UID?'u'+o.n:o instanceof Real?'r'+o.v:typeof o+':'+o;
 function add(o){
  const prim=!(o instanceof Array)&&(o instanceof UID||o instanceof Real||typeof o!=='object');
  if(prim){const k=pk(o);if(memo.has(k))return memo.get(k)}
  const i=objs.length;objs.push(null);
  if(prim){memo.set(pk(o),i);objs[i]={t:'v',v:o}}
  else if(o instanceof Array){const r=o.map(add);objs[i]={t:'a',r}}
  else{const ks=Object.keys(o);const kr=ks.map(k=>add(k));const vr=ks.map(k=>add(o[k]));objs[i]={t:'d',k:kr,v:vr}}
  return i}
 add(root);
 const rs=objs.length<256?1:2;
 const out=[];const push=b=>{for(const x of b)out.push(x)};
 push([...'bplist00'].map(c=>c.charCodeAt(0)));
 const offs=[];
 const intb=n=>n<256?[0x10,n]:n<65536?[0x11,n>>8,n&255]:[0x12,(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255];
 const len=(m,n)=>{if(n<15)push([m|n]);else{push([m|15]);push(intb(n))}};
 const ref=r=>{if(rs===1)push([r]);else push([r>>8,r&255])};
 objs.forEach(o=>{offs.push(out.length);
  if(o.t==='a'){len(0xA0,o.r.length);o.r.forEach(ref)}
  else if(o.t==='d'){len(0xD0,o.k.length);o.k.forEach(ref);o.v.forEach(ref)}
  else{const v=o.v;
   if(v===true)push([9]);else if(v===false)push([8]);
   else if(typeof v==='number')push(intb(v));
   else if(v instanceof Real){const b=new Uint8Array(8);new DataView(b.buffer).setFloat64(0,v.v);push([0x23]);push(b)}
   else if(v instanceof UID){if(v.n<256)push([0x80,v.n]);else push([0x81,v.n>>8,v.n&255])}
   else{len(0x50,v.length);for(const c of v)push([c.charCodeAt(0)])}}});
 const ot=out.length,os=ot<65536?2:4;
 offs.forEach(f=>{if(os===2)push([f>>8,f&255]);else push([f>>>24,(f>>>16)&255,(f>>>8)&255,f&255])});
 const w8=n=>push([0,0,0,0,(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255]);
 push([0,0,0,0,0,0,os,rs]);w8(objs.length);w8(0);w8(ot);
 return Uint8Array.from(out)}
function gestureArchive(evl){
 const O=[];const add=o=>{O.push(o);return new UID(O.length-1)};
 add('$null');
 const root={};const ri=add(root);
 const cl=(n,c)=>add({$classname:n,$classes:c});
 const cVal=cl('NSValue',['NSValue','NSObject']);

async function loadTpls(){if(TP)return TP;const T={};
 for(const n of [1,2,3,4]){const im=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src='data:image/png;base64,'+TPL[n]});
  const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const x=c.getContext('2d');x.drawImage(im,0,0);
  const d=x.getImageData(0,0,c.width,c.height).data,g=new Float32Array(c.width*c.height);for(let i=0;i<g.length;i++)g[i]=0.299*d[4*i]+0.587*d[4*i+1]+0.114*d[4*i+2];

function gradMag(g,w,h){const o=new Float32Array(w*h);for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=y*w+x;
 const gx=(g[i-w+1]+2*g[i+1]+g[i+w+1])-(g[i-w-1]+2*g[i-1]+g[i+w-1]);
 const gy=(g[i+w-1]+2*g[i+w]+g[i+w+1])-(g[i-w-1]+2*g[i-w]+g[i-w+1]);o[i]=Math.sqrt(gx*gx+gy*gy)}return o}
function halfG(g,w,h){const w2=w>>1,h2=h>>1,o=new Float32Array(w2*h2);for(let y=0;y<h2;y++)for(let x=0;x<w2;x++){const i=2*y*w+2*x;o[y*w2+x]=(g[i]+g[i+1]+g[i+w]+g[i+w+1])/4}return o}
function prepT(T,tw,th){const n=tw*th;let m=0;for(let i=0;i<n;i++)m+=T[i];m/=n;const z=new Float32Array(n);let s=0;for(let i=0;i<n;i++){z[i]=T[i]-m;s+=z[i]*z[i]}return{z,s,w:tw,h:th,n}}
function nccAt(G,w,P,x,y){let sI=0,sII=0,sIT=0,k=0;const z=P.z,tw=P.w,th=P.h;for(let j=0;j<th;j++){const r=(y+j)*w+x;for(let i=0;i<tw;i++,k++){const v=G[r+i];sI+=v;sII+=v*v;sIT+=v*z[k]}}const vr=sII-sI*sI/P.n;return vr<1e-6?-1:sIT/Math.sqrt(vr*P.s)}
function findLabel(Gf,wf,hf,Gh,wh,hh,Pf,Ph){
 const y0=Math.floor(hh*0.12),y1=Math.min(hh-Ph.h,Math.floor(hh*0.70)),x1=wh-Ph.w;

 for(let j=0;j<ny;j++)for(let i=0;i<nx;i++)map[j*nx+i]=nccAt(Gh,wh,Ph,i*2,y0+j*2);
 let best={s:-2,x:0,y:0};const K=60,R=5,RF=7;
 for(let c=0;c<K;c++){let bi=-1,bv=-1.5;for(let q=0;q<map.length;q++)if(map[q]>bv){bv=map[q];bi=q}if(bi<0)break;
  const ci=bi%nx,cj=(bi/nx)|0;
  for(let dj=-R;dj<=R;dj++)for(let di=-R;di<=R;di++){const a=ci+di,b=cj+dj;if(a>=0&&a<nx&&b>=0&&b<ny)map[b*nx+a]=-2}
  const fx=ci*4,fy=(y0+cj*2)*2;
  for(let yy=Math.max(0,fy-RF);yy<=Math.min(hf-Pf.h,fy+RF);yy++)for(let xx=Math.max(0,fx-RF);xx<=Math.min(wf-Pf.w,fx+RF);xx++){const s=nccAt(Gf,wf,Pf,xx,yy);if(s>best.s)best={s,x:xx,y:yy}}}

  const d=x.getImageData(0,0,ww,hh).data,g=new Float32Array(ww*hh);for(let i=0;i<g.length;i++)g[i]=0.299*d[4*i]+0.587*d[4*i+1]+0.114*d[4*i+2];

  for(const n of [1,2,3,4])det[n]={s:r[n].s,x:r[n].x*f,y:r[n].y*f,w:T[n].w*f,h:T[n].h*f};

 const used=seqs.filter(s=>s.on);const out=[];
 if(orig)used.forEach(s=>out.push({name:s.name,start:s.start,end:s.end,seconds:s.seconds}));
 out.push({name:cname,strokes:used.map(s=>({start:s.start,end:s.end,seconds:s.seconds})),gaps:used.map(s=>s.gap)});
 return out}
function total3(){const u=seq.filter(s=>s.on);let t=0;u.forEach((s,i)=>{t+=s.seconds+(i<u.length-1?s.gap:0)});return{n:u.length,t}}
function cardHTML(it){return `<div class="sc" data-id="${it.id}"><div class="r1"><span class="hd">≡</span><input type="checkbox" data-f="on" ${it.on?'checked':''}><input data-f="name" value="${esc(it.name)}"><button class="s" data-act="up">▲</button><button class="s" data-act="dn">▼</button><button class="s" data-act="del">×</button></div>
<div class="r2 small">角度 ${ang([it.start.x-it.end.x,it.start.y-it.end.y])}°　秒 <input type="number" data-f="seconds" step="0.01" min="0.01" max="3" value="${it.seconds}" style="width:62px"><button class="s" data-act="fast">即打ち</button><button class="s" data-act="gauge">ゲージ有</button></div>
<div class="gp small">このあとの間隔 <button class="s" data-act="gm">－</button><input type="number" data-f="gap" step="0.5" min="0.1" max="30" value="${it.gap}" style="width:62px"><button class="s" data-act="gp">＋</button> 秒</div></div>`}
function renderSeq(){$('sq').innerHTML=seq.length?seq.map(cardHTML).join(''):'<span class="small">ファイルを読み込むか、ショットを追加してください</span>';upTot()}
function upTot(){const t=total3();$('tot3').textContent='選択中 '+t.n+'手 / 合計 約'+t.t.toFixed(1)+'秒'}
const sqf=e=>{const c=e.target.closest('.sc');return c?seq.find(s=>s.id==c.dataset.id):null};
$('sq').addEventListener('change',e=>{const it=sqf(e),f=e.target.dataset.f;if(!it||!f)return;
 if(f==='on')it.on=e.target.checked;else if(f==='name')it.name=e.target.value;else it[f]=Math.max(f==='gap'?0.1:0.01,+e.target.value||0);upTot()});
$('sq').addEventListener('click',e=>{const b=e.target.closest('[data-act]'),it=sqf(e);if(!b||!it)return;const i=seq.indexOf(it),a=b.dataset.act;
 if(a==='up'&&i>0)[seq[i-1],seq[i]]=[seq[i],seq[i-1]];
 else if(a==='dn'&&i<seq.length-1)[seq[i+1],seq[i]]=[seq[i],seq[i+1]];
 else if(a==='del')seq.splice(i,1);
 else if(a==='fast')it.seconds=0.01;else if(a==='gauge')it.seconds=0.5;
 else if(a==='gm')it.gap=Math.max(0.1,r1(it.gap-0.5));else if(a==='gp')it.gap=Math.min(30,r1(it.gap+0.5));
 renderSeq()});
let drag=null;
$('sq').addEventListener('pointerdown',e=>{const h=e.target.closest('.hd');if(!h)return;e.preventDefault();drag=h.closest('.sc');drag.classList.add('dg');h.setPointerCapture(e.pointerId)});
$('sq').addEventListener('pointermove',e=>{if(!drag)return;const y=e.clientY,L=$('sq');
 let n=drag.nextElementSibling,p=drag.previousElementSibling;
 while(n){const r=n.getBoundingClientRect();if(y>r.top+r.height/2){L.insertBefore(drag,n.nextElementSibling);n=drag.nextElementSibling}else break}
 while(p){const r=p.getBoundingClientRect();if(y<r.top+r.height/2){L.insertBefore(drag,p);p=drag.previousElementSibling}else break}
 if(y<70)window.scrollBy(0,-12);else if(y>window.innerHeight-70)window.scrollBy(0,12)});
const endDrag=()=>{if(!drag)return;drag.classList.remove('dg');drag=null;seq=[...$('sq').children].map(c=>seq.find(s=>s.id==c.dataset.id)).filter(Boolean);renderSeq()};
$('sq').addEventListener('pointerup',endDrag);$('sq').addEventListener('pointercancel',endDrag);
$('f3').onchange=async e=>{const f=e.target.files[0];if(!f)return;
 try{const r=itemsFromList(parseVCC(await f.text()),+$('dg3').value||3);seq=seq.concat(r.items);
  $('info3').textContent=r.items.length+'手を読み込みました';$('sk3').textContent=r.skip.length?'読み込めなかったコマンド: '+r.skip.join('、'):'';renderSeq()}
 catch(x){alert('このファイルは読み込めませんでした')}e.target.value=''};
$('ad3').onclick=()=>{const l=shots.filter(s=>!s.chain);if(!l.length)return alert('ショット作成タブで、先にショットを作ってください');
 l.forEach(s=>seq.push({id:nid++,name:s.name,start:s.start,end:s.end,seconds:s.seconds,gap:+$('dg3').value||3,on:true}));renderSeq()};
$('ap3').onclick=()=>{const g=+$('dg3').value||3;seq.forEach(s=>s.gap=g);renderSeq()};
$('sv3').onclick=()=>{const u=seq.filter(s=>s.on);if(u.length<2)return alert('連続にするショットを2つ以上選んでください');
 const cn=$('cn3').value;if(!cn)return alert('連続コマンドの名前を入れてください');
 const list=buildChain(seq,cn,$('orig3').checked),nm=list.map(s=>s.name),dup=nm.find((n,i)=>nm.indexOf(n)!==i);
 if(dup)return alert('「'+dup+'」が重複しています。名前を直してください');
 dlf(($('fn3').value||'renzoku').replace(/[\\\/:*?"<>|\s]+/g,'_')+'.voicecontrolcommands',makeVCC(list))};
function setTab(n){tab=n;$('m1').style.display=n===1?'grid':'none';$('m2').style.display=n===2?'grid':'none';$('m3').style.display=n===3?'grid':'none';
 $('sh').style.display=n===3?'none':'grid';$('opw').style.display=n===3?'none':'block';
 [1,2,3].forEach(i=>$('t'+i).className=i===n?'':'s');if(n!==3)draw()}
$('t1').onclick=()=>setTab(1);$('t2').onclick=()=>setTab(2);$('t3').onclick=()=>setTab(3);
render();draw();
</script></body></html>
